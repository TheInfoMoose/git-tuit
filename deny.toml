[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[advisories]
unsound = "all"
ignore = [
  # See https://github.com/trishume/syntect/issues/606
  { id = "RUSTSEC-2025-0141", reason = "Only brought in via syntect" },
  # heapless 0.8.0: compiled but unused, see BUG-0060
  { id = "RUSTSEC-2026-0574", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
  { id = "RUSTSEC-2026-0575", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
  { id = "RUSTSEC-2026-0576", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
  { id = "RUSTSEC-2026-0577", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
  { id = "RUSTSEC-2026-0578", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
  { id = "RUSTSEC-2026-0579", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
  { id = "RUSTSEC-2026-0580", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
  { id = "RUSTSEC-2026-0581", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
  { id = "RUSTSEC-2026-0582", reason = "heapless 0.8 via faster-hex 0.10; unreachable because gix-hash enables faster-hex std/alloc (BUG-0060)" },
]

[bans]
multiple-versions = "deny"
skip-tree = [
  # this is needed for:
  #  `bwrap v1.3.0` (https://github.com/micl2e2/bwrap/pull/4)
  { crate = "unicode-width" },
  # currently needed due to:
  # * `redox_users v0.4.6`
  # * `syntect v5.2.0`
  { crate = "thiserror" },
  # currently needed due to:
  # * `gix-hashtable v0.6.0`
  { crate = "hashbrown" },
  # 2022-10-26 `getrandom` and `rustix` were added when `gitoxide` was
  # upgraded from 0.71.0 to 0.74.1.
  # currently needed due to:
  # * `tempfile v3.23.0`
  # * `rand_core v0.6.4`
  # * `redox_users v0.5.0`
  { crate = "getrandom" },
  # currently needed due to:
  # * `crossterm v0.28.1`
  # * `which v7.0.2`
  # * `gix-index v0.42.1`
  # * `tempfile v3.23.0`
  { crate = "rustix" },
  # currently needed due to:
  # * `sha1 v0.10.6` / `sha1-checked v0.10.0`
  # * `sha2 v0.11.0`
  { crate = "digest" },
  # currently needed due to:
  # * `sha1 v0.10.6`
  # * `sha2 v0.11.0`
  { crate = "cpufeatures" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
